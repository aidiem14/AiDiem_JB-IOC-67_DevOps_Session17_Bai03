services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.26
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m -XX:-UseContainerSupport"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - efk-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.26
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - efk-network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.26
    container_name: logstash
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m -XX:-UseContainerSupport"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - efk-network

volumes:
  elasticsearch_data:

networks:
  efk-network:
    driver: bridge
